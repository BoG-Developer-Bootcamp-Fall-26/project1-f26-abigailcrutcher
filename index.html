<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Pokédex</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-white font-[Inter]">
    <h1 class="mt-9 text-center text-[64px] font-bold">Bits of Good Mid-Semester Project</h1>
    <main class="mt-[30px] flex justify-center gap-[244px] pl-3">
        <section id="left-column" class="flex w-[466px] flex-col">
            <div id="image-box" class="flex h-[466px] w-[466px] items-center justify-center border-4 border-black">
                <img id="pokemon-image" class="w-[450px] [image-rendering:pixelated]" src="" alt="Pokemon">
            </div>
            <div id="name-box" class="mt-[33px] flex h-[66px] w-[462px] items-center justify-center rounded-lg border border-black bg-[#E8E8E8]">
                <p id="pokemon-name" class="text-[36px]"></p>
            </div>
            <p class="mt-10 text-2xl font-bold">Types:</p>
            <div id="types-box" class="mt-[17px] flex h-10 gap-2">
            </div>
            <div id="arrow-buttons" class="ml-[37px] mt-11 flex gap-[42px]">
                <button id="previous-button" class="flex h-[68px] w-[174px] items-center justify-center rounded-md bg-[#E8E8E8]">
                    <img class="h-[60px] w-[60px]" src="images/left-arrow.png" alt="Previous">
                </button>
                <button id="next-button" class="flex h-[68px] w-[174px] items-center justify-center rounded-md bg-[#E8E8E8]">
                    <img class="h-[60px] w-[60px]" src="images/right-arrow.png" alt="Next">
                </button>
            </div>
        </section>
        <section id="right-column" class="flex w-[486px] flex-col items-center">
            <h2 id="panel-title" class="-mt-[25px] text-[36px] font-bold">Info</h2>
            <div id="stats-panel" class="mt-[31px] h-[598px] w-[486px] overflow-y-auto bg-[#E8E8E8] px-[35px] py-8 text-[36px] leading-[44px]">
                <div id="info-box">
                </div>
                <div id="moves-box" class="hidden">
                </div>
            </div>
            <div id="tab-buttons" class="mt-[84px] flex gap-[42px]">
                <button id="info-button" class="h-[68px] w-[174px] rounded-md bg-[#7CFF79] text-[36px]">Info</button>
                <button id="moves-button" class="h-[68px] w-[174px] rounded-md bg-[#E8E8E8] text-[36px]">Moves</button>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
