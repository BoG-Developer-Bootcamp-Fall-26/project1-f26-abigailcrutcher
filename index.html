<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Pokédex</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-white">
    <h1>Bits of Good Mid-Semester Project</h1>
    <main>
        <section id="left-column">
            <div id="image-box">
                <img id="pokemon-image" src="" alt="Pokemon">
            </div>
            <div id="name-box">
                <p id="pokemon-name"></p>
            </div>
            <p>Types:</p>
            <div id="types-box">
            </div>
            <div id="arrow-buttons">
                <button id="previous-button">
                    <img src="images/left-arrow.png" alt="Previous">
                </button>
                <button id="next-button">
                    <img src="images/right-arrow.png" alt="Next">
                </button>
            </div>
        </section>
        <section id="right-column">
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
