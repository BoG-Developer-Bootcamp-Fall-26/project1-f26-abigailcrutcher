<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Pokédex</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-white">
    <h1 class="mt-12 text-center text-6xl font-bold">Bits of Good Mid-Semester Project</h1>
    <main class="mt-8 flex justify-center gap-60">
        <section id="left-column" class="flex w-[460px] flex-col">
            <div id="image-box" class="flex h-[460px] w-[460px] items-center justify-center border-[3px] border-black">
                <img id="pokemon-image" class="w-[200px]" src="" alt="Pokemon">
            </div>
            <div id="name-box" class="mt-7 flex h-[66px] w-[460px] items-center justify-center rounded-lg border border-black bg-[#E8E8E8]">
                <p id="pokemon-name" class="text-[32px]"></p>
            </div>
            <p class="mt-10 text-2xl font-bold">Types:</p>
            <div id="types-box" class="mt-3 flex h-10 gap-2">
            </div>
            <div id="arrow-buttons" class="ml-9 mt-10 flex gap-10">
                <button id="previous-button" class="flex h-[68px] w-[170px] items-center justify-center rounded-md bg-[#E8E8E8]">
                    <img class="h-16 w-16" src="images/left-arrow.png" alt="Previous">
                </button>
                <button id="next-button" class="flex h-[68px] w-[170px] items-center justify-center rounded-md bg-[#E8E8E8]">
                    <img class="h-16 w-16" src="images/right-arrow.png" alt="Next">
                </button>
            </div>
        </section>
        <section id="right-column" class="flex w-[480px] flex-col items-center">
            <h2 id="panel-title" class="text-[32px] font-bold">Info</h2>
            <div id="stats-panel" class="mt-3 h-[598px] w-[480px] bg-[#E8E8E8] p-8 text-[36px] leading-[44px]">
                <div id="info-box">
                </div>
                <div id="moves-box">
                </div>
            </div>
            <div id="tab-buttons" class="mt-20 flex gap-11">
                <button id="info-button" class="h-[68px] w-[170px] rounded-md bg-[#7CFF79] text-[36px]">Info</button>
                <button id="moves-button" class="h-[68px] w-[170px] rounded-md bg-[#E8E8E8] text-[36px]">Moves</button>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
